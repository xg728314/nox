<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<link rel="icon" type="image/svg+xml" href="/m/icon-192.svg" />

<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="스태프동기화" />
<meta name="application-name" content="스태프동기화" />
<meta name="format-detection" content="telephone=no" />
<meta name="mobile-web-app-capable" content="yes" />
<script src="/m/labels.js" defer></script>
<script src="/m/utils.js" defer></script>
<script src="/m/nox-api.js" defer></script>

  if ('serviceWorker' in navigator) {

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="style.css" />
<style>
  /* 헤더 카드 (대기 스태프) */
  .who-hero {
    margin: 0 22px 16px;
    padding: 18px 22px;
    background: linear-gradient(135deg, var(--card), #FAF5EC);
    border: 1px solid rgba(196, 155, 97, 0.25);
    border-radius: 22px;
    box-shadow: 0 4px 18px rgba(196, 155, 97, 0.1);
    display: flex; align-items: center; gap: 14px;
  }
  .who-hero .av {
    width: 50px; height: 50px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; letter-spacing: -0.03em;
    background: linear-gradient(135deg, rgba(196,155,97,0.18), rgba(196,155,97,0.08));
    color: var(--gold-deep);
  }
  .who-hero .info { flex: 1; }
  .who-hero .nm {
    font-size: 20px; font-weight: 800; letter-spacing: -0.025em;
    display: flex; align-items: center; gap: 6px;
  }
  .who-hero .nm .badge {
    font-size: 10px; padding: 2px 8px;
    background: rgba(196, 155, 97, 0.18);
    color: var(--gold-deep);
    border-radius: 999px; font-weight: 800;
  }
  .who-hero .sub {
    font-size: 11px; color: var(--sub); font-weight: 600;
    margin-top: 2px; letter-spacing: -0.01em;
  }
  .who-hero .time {
    text-align: right;
  }
  .who-hero .time .lbl {
    font-size: 9px; color: var(--sub); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .who-hero .time .v {
    font-size: 17px; font-weight: 800; color: var(--ink);
    letter-spacing: -0.025em; margin-top: 2px;
  }

  /* 단계 헤더 */
  .step {
    padding: 0 22px;
    margin-bottom: 14px;
  }
  .step .h {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .step .h .num {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
  }
  .step .h .lbl {
    font-size: 14px; font-weight: 800; letter-spacing: -0.02em;
  }
  .step .h .lbl b { color: var(--gold-deep); }

  /* 층 선택 그리드 */
  .floor-grid, .store-grid, .type-grid, .time-grid {
    display: grid;
    gap: 8px;
  }
  .floor-grid { grid-template-columns: repeat(4, 1fr); }
  .store-grid { grid-template-columns: repeat(2, 1fr); }
  .type-grid  { grid-template-columns: repeat(3, 1fr); }
  .time-grid  { grid-template-columns: repeat(4, 1fr); }

  .opt {
    padding: 14px 8px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
  }
  .opt:active { transform: scale(0.95); }
  .opt.selected {
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 16px rgba(196, 155, 97, 0.35);
  }
  .opt .ic { font-size: 16px; line-height: 1; margin-bottom: 3px; }
  .opt .nm {
    font-size: 13px; font-weight: 800; letter-spacing: -0.01em;
  }
  .opt .sub-lbl {
    font-size: 9px; color: var(--sub); font-weight: 700;
    margin-top: 2px; letter-spacing: -0.01em;
  }
  .opt.selected .sub-lbl { color: rgba(255,255,255,0.85); }

  /* 종목별 색 (선택 전) */
  .opt.S { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); }
  .opt.P { background: linear-gradient(135deg, #F5F2EA, #EFEBE3); }
  .opt.H { background: linear-gradient(135deg, #FEF2F2, #FEE2E2); }
  .opt.S.selected { background: linear-gradient(135deg, var(--S), #3B82F6); }
  .opt.P.selected { background: linear-gradient(135deg, #6B6560, #4B4640); }
  .opt.H.selected { background: linear-gradient(135deg, var(--H), #DC2626); }

  .opt.disabled {
    opacity: 0.35; cursor: not-allowed; pointer-events: none;
  }

  /* 가게 영역 — 비어있을 때 안내 */
  .stores-area {
    min-height: 60px;
  }
  .stores-area .placeholder {
    padding: 18px;
    background: var(--bg-soft);
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--sub);
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* 룸 번호 */
  .room-wrap {
    display: flex; gap: 8px; align-items: center;
  }
  .room-wrap input {
    flex: 1;
    padding: 14px 18px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    font-family: inherit;
    font-size: 16px; font-weight: 800;
    color: var(--ink);
    outline: none;
    letter-spacing: -0.02em;
    text-align: center;
  }
  .room-wrap input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(196, 155, 97, 0.15);
  }

  /* 미리보기 카드 */
  .preview {
    margin: 22px 22px 0;
    padding: 18px 20px;
    background: linear-gradient(135deg, var(--ink), #1a1813);
    color: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 24px rgba(45, 43, 38, 0.25);
    position: relative; overflow: hidden;
  }
  .preview::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(196, 155, 97, 0.25), transparent 70%);
    pointer-events: none;
  }
  .preview .lbl {
    position: relative; z-index: 1;
    font-size: 11px; color: var(--gold-soft);
    font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .preview .body {
    position: relative; z-index: 1;
    font-size: 16px; font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.5;
  }
  .preview .body b { color: var(--gold-soft); }
  .preview .body em {
    display: inline-block; padding: 2px 8px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    font-size: 13px; font-style: normal;
    margin: 0 2px;
  }
  .preview .at {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-size: 11px; color: rgba(255,255,255,0.6);
    font-weight: 600;
    display: flex; justify-content: space-between;
    position: relative; z-index: 1;
  }
  .preview .at .v { color: #fff; font-weight: 800; }

  /* 저장 버튼 */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 14px 22px 28px;
    background: linear-gradient(180deg, transparent, var(--bg) 40%);
    z-index: 60;
    display: flex; gap: 8px;
  }
  @media (max-width: 500px) {
    .bottom-bar { padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 14px); }
  }
  .bottom-bar .cancel {
    padding: 14px 22px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 16px;
    font-size: 14px; font-weight: 800;
    text-decoration: none; text-align: center;
  }
  .bottom-bar .save-btn {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #fff; border: none;
    border-radius: 16px;
    font-size: 14px; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(196, 155, 97, 0.35);
    letter-spacing: -0.02em;
    transition: opacity 0.15s, transform 0.15s;
  }
  .bottom-bar .save-btn:active { transform: scale(0.97); }
  .bottom-bar .save-btn:disabled {
    background: var(--bg-soft);
    color: var(--sub);
    box-shadow: none; cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="phone-frame"><div class="phone-screen"><div class="screen" style="padding-bottom: 140px;">

  <header class="page-header">
    <a href="index.html" class="back">←</a>
    <div class="ttl" id="page-title">세션 등록</div>
    <a href="javascript:void(0)" class="more" aria-label="더보기">⋯</a>
  </header>

  <!-- 스태프 헤더 -->
  <div class="who-hero">
    <div class="av" id="hero-av">방</div>
    <div class="info">
      <div class="nm" id="hero-nm">방울 <span class="badge">대기 중</span></div>
      <div class="sub" id="hero-sub">어디 들어가요?</div>
    </div>
    <div class="time">
      <div class="lbl">지금</div>
      <div class="v" id="hero-time">--:--</div>
    </div>
  </div>

  <!-- Step 1: 층 -->
  <div class="step">
    <div class="h"><div class="num">1</div><div class="lbl">층 선택</div></div>
    <div class="floor-grid" id="floor-grid">
      <div class="opt" data-floor="5"><div class="ic">🏢</div><div class="nm">5층</div><div class="sub-lbl">매장 2</div></div>
      <div class="opt" data-floor="6"><div class="ic">🏢</div><div class="nm">6층</div><div class="sub-lbl">매장 4</div></div>
      <div class="opt" data-floor="7"><div class="ic">🏢</div><div class="nm">7층</div><div class="sub-lbl">매장 2</div></div>
      <div class="opt" data-floor="8"><div class="ic">🏢</div><div class="nm">8층</div><div class="sub-lbl">매장 6</div></div>
    </div>
  </div>

  <!-- Step 2: 룸 -->
  <div class="step">
    <div class="h"><div class="num">2</div><div class="lbl">룸</div></div>
    <div class="stores-area" id="stores-area">
      <div class="placeholder">먼저 층을 선택하세요</div>
    </div>
  </div>

  <!-- Step 3: 종목 -->
  <div class="step">
    <div class="h"><div class="num">3</div><div class="lbl">종목</div></div>
    <div class="type-grid" id="type-grid">
      <div class="opt P" data-type="P"><div class="ic">●</div><div class="nm">P 타입</div><div class="sub-lbl">13만</div></div>
      <div class="opt S" data-type="S"><div class="ic">★</div><div class="nm">S 타입</div><div class="sub-lbl">14만</div></div>
      <div class="opt H" data-type="H"><div class="ic">♥</div><div class="nm">H 타입</div><div class="sub-lbl">12만</div></div>
    </div>
  </div>

  <!-- Step 4: 시간 -->
  <div class="step">
    <div class="h"><div class="num">4</div><div class="lbl">시간</div></div>
    <div class="time-grid" id="time-grid">
      <div class="opt" data-dur="60"><div class="ic">⏱</div><div class="nm">풀</div><div class="sub-lbl">60분</div></div>
      <div class="opt" data-dur="30"><div class="ic">⏱</div><div class="nm">하프</div><div class="sub-lbl">30분</div></div>
      <div class="opt" data-dur="15"><div class="ic">⏱</div><div class="nm">추가</div><div class="sub-lbl">15분</div></div>
      <div class="opt" data-dur="45"><div class="ic">⏱</div><div class="nm">하프+추가</div><div class="sub-lbl">45분</div></div>
    </div>
  </div>

  <!-- Step 5: 룸 번호 (선택) -->
  <div class="step">
    <div class="h"><div class="num">5</div><div class="lbl">룸 (선택)</div></div>
    <div class="room-wrap">
      <input type="text" id="room-input" inputmode="numeric" placeholder="3" autocomplete="off" maxlength="3" />
    </div>
  </div>

  <!-- 미리보기 -->
  <div class="preview" id="preview" style="display: none;">
    <div class="lbl">⚡ 등록 미리보기</div>
    <div class="body" id="preview-body"></div>
    <div class="at">
      <span>시작 시각</span>
      <span class="v" id="preview-time"></span>
    </div>
  </div>

  <div style="height: 100px;"></div>

  <div class="bottom-bar">
    <a href="index.html" class="cancel">취소</a>
    <button class="save-btn" id="save-btn" disabled>세션 등록</button>
  </div>

</div></div></div>

<script>
(function () {
  'use strict';

  // ─── Mock fallback (API 실패 시) ───────────────────
  const MOCK_FLOORS = {
    5: [{ id: null, room_no: '본 매장', floor_no: 5 }],
    6: [{ id: null, room_no: '지점 B', floor_no: 6 }],
    7: [{ id: null, room_no: '지점 D', floor_no: 7 }],
    8: [{ id: null, room_no: '지점 E', floor_no: 8 }],
  };
  // Mock 종목/시간 (NOX 비즈니스 규칙 기반)
  const MOCK_TYPES = {
    P: { name: '퍼블릭', durations: { 90: 130000, 45: 70000, 15: 30000 } },
    S: { name: '셔츠',   durations: { 60: 140000, 30: 70000, 15: 30000 } },
    H: { name: '하퍼',   durations: { 60: 120000, 30: 60000, 15: 30000 } },
  };

  const esc = (window.SecUtils && window.SecUtils.escapeHtml) ||
              (s => String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;'));

  const params = new URLSearchParams(location.search);
  const staffParam = params.get('staff') || '';
  // staffParam 는 membership_id 또는 이름. API 응답에서 둘 다 매칭.

  // ─── 상태 / DOM ─────────────────────────────────
  // state.floor: 숫자, state.room: 선택된 룸 row, state.type: 'P'|'S'|'H'
  // state.dur: { time_minutes, time_type, price, manager_deduction }
  const state = {
    floor: null,
    room: null,        // 선택된 room row (id, room_no, ...)
    roomManual: '',    // 수동 입력 룸 번호 (룸 목록 없을 때)
    type: null,
    dur: null,
  };

  let ME = null;              // /api/auth/me 응답
  let STAFF = null;           // 매칭된 hostess { membership_id, name, ... }
  let FLOORS = MOCK_FLOORS;   // {5: [room, ...], 6: [...]}
  let TYPES_BY_CAT = null;    // {P: {name, durations: {time_minutes: {price, time_type, manager_deduction}}}}
  let usingMock = true;       // API 실패 → mock 모드

  // 헤더 초기 값
  const $heroNm   = document.getElementById('hero-nm');
  const $heroAv   = document.getElementById('hero-av');
  const $heroSub  = document.getElementById('hero-sub');
  const $pageTtl  = document.getElementById('page-title');
  const $heroTime = document.getElementById('hero-time');
  const $stores   = document.getElementById('stores-area');
  const $typeGrid = document.getElementById('type-grid');
  const $timeGrid = document.getElementById('time-grid');
  const $preview  = document.getElementById('preview');
  const $previewBody = document.getElementById('preview-body');
  const $previewTime = document.getElementById('preview-time');
  const $save     = document.getElementById('save-btn');
  const $room     = document.getElementById('room-input');
  const $floorGrid = document.getElementById('floor-grid');

  function haptic(d) { if (navigator.vibrate) navigator.vibrate(d || 8); }
  function toast(msg, opt) {
    if (window.NoxUI && window.NoxUI.toast) window.NoxUI.toast(msg, opt);
    else if (opt && opt.type === 'error') console.warn(msg);
  }
  function now() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function refreshTime() {
    const t = now();
    if ($heroTime) $heroTime.textContent = t;
    if ($previewTime) $previewTime.textContent = t;
  }
  refreshTime();
  setInterval(refreshTime, 30 * 1000);

  // ─── 헤더 채우기 (staffParam 매칭) ─────────────────
  function setStaffHeader(staff) {
    const display = (staff && (staff.nickname || staff.name || staff.hostess_name)) || staffParam || '?';
    if ($heroNm) {
      $heroNm.firstChild.textContent = display + ' ';
    }
    if ($heroAv) $heroAv.textContent = (display.charAt(0) || '?');
    if ($pageTtl) $pageTtl.textContent = display + ' 세션 등록';
  }
  setStaffHeader(null);

  // ─── 종목/시간 렌더 ─────────────────────────────
  // service-types 응답을 카테고리(P/S/H)별로 정규화
  function normalizeServiceTypes(raw) {
    // raw.service_types: [{service_type:'퍼블릭', time_type:'기본', time_minutes:90, price:130000, manager_deduction, has_greeting_check, sort_order}]
    const TYPE_KO_TO_KEY = { '퍼블릭': 'P', '셔츠': 'S', '하퍼': 'H' };
    const out = { P: { name: '퍼블릭', durations: {} },
                  S: { name: '셔츠',   durations: {} },
                  H: { name: '하퍼',   durations: {} } };
    const list = Array.isArray(raw?.service_types) ? raw.service_types : [];
    list.forEach(t => {
      const key = TYPE_KO_TO_KEY[t.service_type];
      if (!key) return;
      const mins = Number(t.time_minutes) || 0;
      if (mins <= 0) return;
      out[key].durations[mins] = {
        price: Number(t.price) || 0,
        time_type: t.time_type || '기본',
        manager_deduction: Number(t.manager_deduction) || 0,
        has_greeting_check: !!t.has_greeting_check,
      };
    });
    return out;
  }

  function renderTypeGrid() {
    if (!TYPES_BY_CAT) return;
    const cats = ['P', 'S', 'H'];
    $typeGrid.innerHTML = cats.map(c => {
      const t = TYPES_BY_CAT[c];
      const dKeys = Object.keys(t.durations);
      const minPrice = dKeys.length
        ? Math.min(...dKeys.map(k => t.durations[k].price))
        : 0;
      const priceLbl = minPrice ? Math.round(minPrice / 10000) + '만~' : '—';
      const ic = c === 'P' ? '●' : c === 'S' ? '★' : '♥';
      return `<div class="opt ${c}" data-type="${c}">
        <div class="ic">${ic}</div>
        <div class="nm">${esc(t.name)}</div>
        <div class="sub-lbl">${esc(priceLbl)}</div>
      </div>`;
    }).join('');
    bindGroup($typeGrid, 'type', (val) => {
      state.type = val;
      state.dur = null;
      renderTimeGrid();
    });
  }

  function renderTimeGrid() {
    if (!state.type || !TYPES_BY_CAT) {
      $timeGrid.innerHTML = '<div class="placeholder" style="grid-column: 1 / -1;">먼저 종목을 선택하세요</div>';
      return;
    }
    const t = TYPES_BY_CAT[state.type];
    const durs = t.durations;
    const sortedMins = Object.keys(durs).map(Number).sort((a, b) => b - a);
    if (sortedMins.length === 0) {
      $timeGrid.innerHTML = '<div class="placeholder" style="grid-column: 1 / -1;">설정된 시간 단가가 없습니다</div>';
      return;
    }
    $timeGrid.innerHTML = sortedMins.map(mins => {
      const d = durs[mins];
      const priceLbl = Math.round(d.price / 10000) + '만';
      // 시간 라벨: '기본' '반티' '차3'
      const tLbl = d.time_type || (mins + '분');
      return `<div class="opt" data-dur="${mins}">
        <div class="ic">⏱</div>
        <div class="nm">${esc(tLbl)}</div>
        <div class="sub-lbl">${mins}분 · ${priceLbl}</div>
      </div>`;
    }).join('');
    bindGroup($timeGrid, 'dur', (val) => {
      const mins = Number(val);
      const d = durs[mins];
      state.dur = {
        time_minutes: mins,
        time_type: d.time_type,
        price: d.price,
        manager_deduction: d.manager_deduction,
      };
    });
  }

  function bindGroup($group, key, onChange) {
    $group.querySelectorAll('.opt').forEach(o => {
      o.addEventListener('click', () => {
        $group.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
        o.classList.add('selected');
        haptic(10);
        onChange(o.dataset[key]);
        updatePreview();
      });
    });
  }

  // ─── 룸 렌더 ─────────────────────────────────
  function renderRooms() {
    if (!state.floor) {
      $stores.innerHTML = '<div class="placeholder">먼저 층을 선택하세요</div>';
      return;
    }
    const list = FLOORS[state.floor] || [];
    if (list.length === 0) {
      $stores.innerHTML = '<div class="placeholder">이 층에 등록된 룸이 없습니다</div>';
      return;
    }
    $stores.innerHTML = '<div class="store-grid">' +
      list.map((r, i) => {
        const label = r.room_name || ('Room ' + (r.room_no ?? '?'));
        return `<div class="opt" data-room-idx="${i}">
          <div class="ic">🚪</div>
          <div class="nm">${esc(label)}</div>
        </div>`;
      }).join('') +
      '</div>';
    $stores.querySelectorAll('.opt').forEach(o => {
      o.addEventListener('click', () => {
        $stores.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
        o.classList.add('selected');
        const idx = Number(o.dataset.roomIdx);
        state.room = list[idx];
        haptic(10);
        updatePreview();
      });
    });
  }

  // ─── 층 선택 ─────────────────────────────────
  function bindFloors() {
    // 층 목록은 정적 (5~8). FLOORS map 에 데이터 있는 층만 활성
    $floorGrid.querySelectorAll('.opt').forEach(o => {
      const floor = Number(o.dataset.floor);
      const count = (FLOORS[floor] || []).length;
      const $sub = o.querySelector('.sub-lbl');
      if ($sub) $sub.textContent = count ? '룸 ' + count : '없음';
      if (count === 0) o.classList.add('disabled');
      else o.classList.remove('disabled');

      o.addEventListener('click', () => {
        if (o.classList.contains('disabled')) return;
        $floorGrid.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
        o.classList.add('selected');
        state.floor = floor;
        state.room = null;
        haptic(10);
        renderRooms();
        updatePreview();
      });
    });
  }

  // 룸 번호 수동 입력 (백업) — 룸 목록에 ID 가 없는 mock 모드에서만 의미
  $room.addEventListener('input', () => {
    state.roomManual = $room.value.replace(/[^0-9]/g, '').slice(0, 3);
    $room.value = state.roomManual;
    updatePreview();
  });

  function updatePreview() {
    const ready = state.floor && state.room && state.type && state.dur;
    if (!ready) {
      $preview.style.display = 'none';
      $save.disabled = true;
      return;
    }
    $preview.style.display = '';
    $save.disabled = false;

    const t = TYPES_BY_CAT[state.type];
    const priceLbl = Math.round(state.dur.price / 10000) + '만원';
    const roomLbl = state.room.room_name || ('Room ' + state.room.room_no);
    const storeLbl = ME?.store_name || '본 매장';
    const staffName = (STAFF && (STAFF.nickname || STAFF.name || STAFF.hostess_name)) || staffParam || '스태프';

    $previewBody.innerHTML =
      `<b>${esc(staffName)}</b> 가 ` +
      `<b>${esc(storeLbl)}</b> ` +
      `<em>${esc(roomLbl)}</em> 에서<br>` +
      `<em>${esc(t.name)} · ${esc(state.dur.time_type)} ${state.dur.time_minutes}분</em><br>` +
      `<span style="font-size:13px; color: rgba(255,255,255,0.6); font-weight:600;">단가 ${priceLbl}</span>`;
  }

  // ─── 저장: 체크인 + 참여자 추가 ───────────────────
  async function doSave() {
    if ($save.disabled) return;
    haptic([10, 50, 10]);

    // mock 모드 (API 실패) → 토스트만
    if (usingMock || !state.room?.id || !ME?.membership_id || !STAFF?.membership_id) {
      const t = TYPES_BY_CAT[state.type];
      const staffName = (STAFF && (STAFF.nickname || STAFF.name)) || staffParam || '스태프';
      toast(`${staffName} → ${t.name} 등록됨 (mock)`, { type: 'success' });
      setTimeout(() => { location.href = 'index.html'; }, 900);
      return;
    }

    $save.disabled = true;
    const originalLabel = $save.textContent;
    $save.textContent = '등록 중...';
    try {
      // 1) 체크인 → session_id
      const checkin = await window.NoxAPI.checkin(
        state.room.id,
        ME.membership_id,
        { manager_name: ME.full_name || ME.store_name || '' }
      );
      const sessionId = checkin?.session_id || checkin?.session?.session_id || checkin?.session?.id;
      if (!sessionId) throw new Error('session_id 응답 없음');

      // 2) 참여자 추가
      await window.NoxAPI.addParticipant(sessionId, {
        membership_id: STAFF.membership_id,
        category: state.type,
        time_minutes: state.dur.time_minutes,
        time_type: state.dur.time_type,
        manager_deduction: state.dur.manager_deduction,
      });

      toast('세션 등록 완료', { type: 'success' });
      setTimeout(() => { location.href = 'holes.html'; }, 700);
    } catch (err) {
      const msg = err?.message || String(err);
      toast('등록 실패: ' + msg, { type: 'error' });
      $save.disabled = false;
      $save.textContent = originalLabel;
    }
  }
  $save.addEventListener('click', doSave);

  // ─── 초기화: API 로드 ────────────────────────────
  async function init() {
    bindFloors();
    renderTypeGrid();
    renderTimeGrid();

    if (!window.NoxAPI) {
      // API 없음 → mock 모드
      return;
    }
    try {
      const [meRes, hostRes, roomsRes, typesRes] = await Promise.all([
        window.NoxAPI.me(),
        window.NoxAPI.hostesses(),
        window.NoxAPI.rooms(),
        window.NoxAPI.serviceTypes(),
      ]);

      ME = meRes || null;

      // staffParam 매칭 (membership_id 우선, 이름 fallback)
      const list = Array.isArray(hostRes?.hostesses) ? hostRes.hostesses : [];
      STAFF = list.find(h => {
        const id = h.membership_id || h.hostess_id;
        return id === staffParam;
      }) || list.find(h => (h.nickname === staffParam || h.name === staffParam || h.hostess_name === staffParam)) || null;
      setStaffHeader(STAFF);
      if ($heroSub) $heroSub.textContent = STAFF ? '어디 들어가요?' : '스태프 미선택 (mock)';

      // 룸 → 층별 그룹핑
      const rooms = Array.isArray(roomsRes?.rooms) ? roomsRes.rooms : [];
      if (rooms.length > 0) {
        const grouped = {};
        rooms.forEach(r => {
          const f = Number(r.floor_no);
          if (!Number.isFinite(f)) return;
          (grouped[f] = grouped[f] || []).push(r);
        });
        // 룸 번호로 정렬
        Object.keys(grouped).forEach(f => {
          grouped[f].sort((a, b) => Number(a.room_no || 0) - Number(b.room_no || 0));
        });
        FLOORS = grouped;
      }

      // 종목 / 시간
      if (Array.isArray(typesRes?.service_types) && typesRes.service_types.length > 0) {
        TYPES_BY_CAT = normalizeServiceTypes(typesRes);
      }

      usingMock = false;
      // 다시 렌더
      bindFloors();
      renderTypeGrid();
      renderTimeGrid();
    } catch (err) {
      console.warn('[assign-session] API 실패, mock 유지:', err?.message || err);
      // FLOORS / TYPES_BY_CAT 가 null/mock 인 상태로 유지
    }
    // TYPES_BY_CAT 가 아직 없으면 mock 사용
    if (!TYPES_BY_CAT) TYPES_BY_CAT = MOCK_TYPES;
    renderTypeGrid();
  }
  init();
})();
</script>
